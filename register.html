<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ลงทะเบียน - CRA THE TUTOR 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css" rel="stylesheet">
  
  <style>
    body { font-family: 'Noto Sans Thai', sans-serif; background: #0f172a; color: #0f172a; }
    .input-wrapper { margin-bottom: 1.5rem; position: relative; }
    .input-label { display: block; font-size: 0.95rem; font-weight: 700; color: #334155; margin-bottom: 0.5rem; }
    .req { color: #ef4444; margin-left: 2px; }
    
    .input-field, select.input-field { 
        width: 100%; padding: 1rem 1.25rem; border-radius: 1rem; 
        border: 1px solid #e2e8f0; background: #f8fafc; outline: none; transition: 0.3s; 
        font-weight: 600; font-size: 0.95rem; color: #0f172a;
        appearance: none; -webkit-appearance: none;
    }
    .input-field:focus { background: #ffffff; border-color: #f97316; box-shadow: 0 0 0 4px rgba(249,115,22,0.1); }
    select.input-field { padding-right: 2.5rem; cursor: pointer; }
    
    .autocomplete-dropdown { 
        position: absolute; z-index: 50; width: 100%; background: #fff; 
        border: 1px solid #e2e8f0; border-radius: 1rem; max-height: 250px; 
        overflow-y: auto; display: none; box-shadow: 0 20px 50px -10px rgba(0,0,0,0.1); margin-top: 8px; 
    }
    .autocomplete-dropdown li { padding: 1rem 1.25rem; border-bottom: 1px solid #f8fafc; cursor: pointer; font-weight: 500; }
    .autocomplete-dropdown li:hover { background: #fff7ed; color: #ea580c; padding-left: 1.5rem; transition: 0.2s;}
    
    .custom-checkbox { display: flex; gap: 1rem; cursor: pointer; padding: 1rem; border-radius: 1rem; background: #f8fafc; border: 1px solid #e2e8f0; }
    .custom-checkbox input { appearance: none; width: 1.4rem; height: 1.4rem; border: 2px solid #cbd5e1; border-radius: 0.4rem; flex-shrink: 0; cursor: pointer; background: #fff; margin-top: 0.1rem; }
    .custom-checkbox input:checked { background: #f97316; border-color: #f97316; }
    .custom-checkbox input:checked::after { content: '\2714'; position: absolute; margin-left: 0.3rem; color: white; font-weight: bold; }
  </style>
</head>
<body class="flex justify-center p-4 lg:p-8">

  <div class="w-full max-w-3xl bg-white rounded-3xl overflow-hidden shadow-2xl relative">
    
    <!-- Header -->
    <div class="bg-slate-900 px-6 py-8 text-white relative overflow-hidden" id="headerSection">
      <div class="absolute -right-10 -top-10 w-40 h-40 bg-orange-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
      <a href="index.html" class="inline-flex items-center gap-2 text-sm text-slate-300 hover:text-white font-bold transition-colors mb-6 bg-white/10 px-4 py-2 rounded-full border border-white/20 backdrop-blur-sm relative z-10 no-underline">
        <i class="fi fi-sr-arrow-small-left mt-0.5 text-lg"></i> กลับหน้าหลัก
      </a>
      <div class="relative z-10">
        <p class="text-[12px] font-black tracking-widest text-orange-400 mb-2">CRA THE TUTOR 2026</p>
        <h1 class="text-2xl md:text-3xl font-black">ฟอร์มลงทะเบียน</h1>
      </div>
    </div>

    <!-- Loading Cover -->
    <div id="formLoading" class="absolute inset-0 bg-white/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center pt-20">
      <i class="fi fi-sr-spinner animate-spin text-4xl text-blue-500 mb-4"></i>
      <p class="font-bold text-slate-600">กำลังเตรียมข้อมูล...</p>
    </div>

    <div class="p-6 md:p-8 relative z-10" id="formWrapper">
      <form id="regForm">
        
        <div class="input-wrapper mb-8">
          <label class="input-label text-lg text-blue-600">1. หลักสูตรที่ต้องการลงทะเบียน<span class="req">*</span></label>
          <div class="relative">
            <select id="course" class="input-field border-2 border-blue-100 bg-blue-50/30 text-blue-900">
              <option value="">-- กำลังโหลดข้อมูล... --</option>
            </select>
            <i class="fi fi-sr-angle-small-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl pointer-events-none"></i>
          </div>
        </div>

        <label class="input-label text-lg text-slate-800">2. ข้อมูลส่วนตัว</label>
        <div class="grid grid-cols-1 md:grid-cols-12 gap-x-4">
          <div class="md:col-span-4 input-wrapper">
            <label class="input-label">คำนำหน้า<span class="req">*</span></label>
            <div class="relative">
              <select id="prefix" class="input-field"><option value="">เลือก</option><option value="นาย">นาย</option><option value="นางสาว">นางสาว</option></select>
              <i class="fi fi-sr-angle-small-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl pointer-events-none"></i>
            </div>
          </div>
          <div class="md:col-span-8 input-wrapper">
            <label class="input-label">ชื่อจริง<span class="req">*</span></label>
            <input type="text" id="fname" class="input-field" placeholder="ไม่ต้องระบุคำนำหน้า">
          </div>
        </div>
        <div class="input-wrapper">
          <label class="input-label">นามสกุล<span class="req">*</span></label>
          <input type="text" id="lname" class="input-field">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4">
          <div class="input-wrapper relative">
            <label class="input-label">อีเมล<span class="req">*</span></label>
            <input type="email" id="email" class="input-field" placeholder="example@gmail.com" oninput="showEmailSuggestions(this.value)" autocomplete="off">
            <ul id="emailDropdown" class="autocomplete-dropdown"></ul>
          </div>
          <div class="input-wrapper">
            <label class="input-label">เบอร์โทรศัพท์มือถือ<span class="req">*</span></label>
            <input type="tel" id="phone" class="input-field" maxlength="12" placeholder="0XX-XXX-XXXX" oninput="formatPhone(this)">
          </div>
        </div>

        <label class="input-label text-lg text-slate-800 mt-4">3. ข้อมูลการศึกษา</label>
        <div class="input-wrapper relative">
          <label class="input-label">โรงเรียน<span class="req">*</span></label>
          <input type="text" id="schoolSearch" class="input-field" placeholder="พิมพ์เพื่อค้นหาโรงเรียน..." oninput="searchSchool(this.value)" autocomplete="off">
          <ul id="schoolDropdown" class="autocomplete-dropdown"></ul>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4">
          <div class="input-wrapper">
            <label class="input-label">จังหวัดของโรงเรียน<span class="req">*</span></label>
            <div class="relative">
              <select id="province" class="input-field"><option value="">-- เลือกจังหวัด --</option></select>
              <i class="fi fi-sr-angle-small-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl pointer-events-none"></i>
            </div>
          </div>
          <div class="input-wrapper">
            <label class="input-label">ระดับชั้น<span class="req">*</span></label>
            <div class="relative">
              <select id="grade" class="input-field">
                <option value="">-- เลือก --</option>
                <option value="มัธยมศึกษาปีที่ 4">มัธยมศึกษาปีที่ 4</option>
                <option value="มัธยมศึกษาปีที่ 5">มัธยมศึกษาปีที่ 5</option>
                <option value="มัธยมศึกษาปีที่ 6">มัธยมศึกษาปีที่ 6</option>
                <option value="เทียบเท่า / อื่นๆ">เทียบเท่า / อื่นๆ</option>
              </select>
              <i class="fi fi-sr-angle-small-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl pointer-events-none"></i>
            </div>
          </div>
        </div>

        <label class="input-label text-lg text-slate-800 mt-4">4. แบบสำรวจ</label>
        <div class="input-wrapper">
          <label class="input-label">ท่านทราบข่าวสารจากช่องทางใด (เลือกได้มากกว่า 1)<span class="req">*</span></label>
          <div id="sourceGroup" class="space-y-2 mt-2"></div>
        </div>
        
        <div class="input-wrapper">
          <label class="input-label">ปัจจุบันติดตามเพจ Education CRA หรือไม่?<span class="req">*</span></label>
          <div class="relative">
            <select id="followPage" class="input-field" onchange="togglePlatform(this.value)"><option value="">-- เลือก --</option><option value="ติดตาม">ใช่, ติดตาม</option><option value="ไม่ได้ติดตาม">ไม่ได้ติดตาม</option></select>
            <i class="fi fi-sr-angle-small-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl pointer-events-none"></i>
          </div>
        </div>
        <div class="input-wrapper hidden bg-orange-50 p-4 rounded-xl border border-orange-100" id="wrapPlatform">
          <label class="input-label text-orange-600">แพลตฟอร์มที่ติดตามหลัก<span class="req">*</span></label>
          <div class="relative">
            <select id="followPlatform" class="input-field border-white"><option value="">-- เลือก --</option><option value="Facebook">Facebook</option><option value="Instagram">Instagram</option><option value="TikTok">TikTok</option><option value="X (Twitter)">X</option></select>
            <i class="fi fi-sr-angle-small-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl pointer-events-none"></i>
          </div>
        </div>

        <button type="button" id="submitBtn" onclick="submitForm()" class="mt-8 w-full bg-gradient-to-r from-orange-500 to-red-500 text-white py-4 rounded-2xl font-black text-lg shadow-lg hover:-translate-y-1 transition-transform flex justify-center gap-2">
          ยืนยันการลงทะเบียน <i class="fi fi-sr-check-circle mt-1"></i>
        </button>
      </form>

      <div id="successView" class="hidden text-center py-4">
        <div class="w-20 h-20 bg-emerald-50 rounded-[2rem] flex items-center justify-center mx-auto mb-4 border border-emerald-100">
            <i class="fi fi-sr-check-circle text-4xl text-emerald-500 mt-1"></i>
        </div>
        <h2 class="text-3xl font-black text-slate-900 mb-1">ลงทะเบียนสำเร็จ!</h2>
        <p class="text-slate-500 mb-6 font-medium">ยินดีต้อนรับสู่โครงการติว</p>
        
        <div class="bg-slate-900 p-8 rounded-3xl text-white shadow-xl mx-auto mb-6 w-full max-w-sm">
            <p class="text-sm text-slate-400 font-medium mb-1">หลักสูตร: <span id="displayCourse" class="text-white font-bold"></span></p>
            <div class="text-5xl font-black tracking-wider text-orange-400 mb-6" id="displayId">--</div>
            
            <div class="bg-white p-3 rounded-2xl inline-block shadow-inner">
               <img id="qrImage" src="" alt="QR Code" class="w-48 h-48 object-contain">
            </div>
            
            <div class="mt-4 bg-orange-500/20 text-orange-300 p-3 rounded-xl border border-orange-500/30 font-bold text-sm flex items-start gap-2 text-left leading-snug">
               <i class="fi fi-sr-camera mt-0.5"></i>
               <span>โปรดแคปหน้าจอนี้ หรือบันทึกรูป QR Code เพื่อใช้สแกนยืนยันตัวตนในวันงาน</span>
            </div>
        </div>

        <a href="index.html" class="inline-block w-full bg-slate-100 text-slate-700 py-3.5 rounded-xl font-bold hover:bg-slate-200 transition-colors no-underline">กลับหน้าหลัก</a>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzn5Jkj1XfL4aIJ71xdc0bs8pi8iwTo3XSGErhlHkqsgaWP61qkqF9KaJQ4QMaAWsf/exec";
    
    let schoolData = [];
    const provincesList = ["กรุงเทพมหานคร","กระบี่","กาญจนบุรี","กาฬสินธุ์","กำแพงเพชร","ขอนแก่น","จันทบุรี","ฉะเชิงเทรา","ชลบุรี","ชัยนาท","ชัยภูมิ","ชุมพร","เชียงราย","เชียงใหม่","ตรัง","ตราด","ตาก","นครนายก","นครปฐม","นครพนม","นครราชสีมา","นครศรีธรรมราช","นครสวรรค์","นนทบุรี","นราธิวาส","น่าน","บึงกาฬ","บุรีรัมย์","ปทุมธานี","ประจวบคีรีขันธ์","ปราจีนบุรี","ปัตตานี","พระนครศรีอยุธยา","พะเยา","พังงา","พัทลุง","พิจิตร","พิษณุโลก","เพชรบุรี","เพชรบูรณ์","แพร่","ภูเก็ต","มหาสารคาม","มุกดาหาร","แม่ฮ่องสอน","ยโสธร","ยะลา","ร้อยเอ็ด","ระนอง","ระยอง","ราชบุรี","ลพบุรี","ลำปาง","ลำพูน","เลย","ศรีสะเกษ","สกลนคร","สงขลา","สตูล","สมุทรปราการ","สมุทรสงคราม","สมุทรสาคร","สระแก้ว","สระบุรี","สิงห์บุรี","สุโขทัย","สุพรรณบุรี","สุราษฎร์ธานี","สุรินทร์","หนองคาย","หนองบัวลำภู","อ่างทอง","อำนาจเจริญ","อุดรธานี","อุตรดิตถ์","อุทัยธานี","อุบลราชธานี"];
    const sources = ["สื่อสังคมออนไลน์เพจ Education CRA", "เว็บไซต์ราชวิทยาลัยจุฬาภรณ์", "แบนเนอร์ประชาสัมพันธ์", "ครูแนะแนว / โรงเรียน", "เพื่อน / คนรู้จักแนะนำ", "งานนิทรรศการการศึกษา"];

    window.onload = () => {
      checkHighSchool();
      
      const provSelect = document.getElementById('province');
      provincesList.forEach(p => provSelect.innerHTML += `<option value="${p}">${p}</option>`);
      
      const group = document.getElementById('sourceGroup');
      sources.forEach(s => group.innerHTML += `<label class="custom-checkbox"><input type="checkbox" name="src" value="${s}"><span>${s}</span></label>`);

      const urlParams = new URLSearchParams(window.location.search);
      const preSelectedCourse = urlParams.get('course');

      Promise.all([
        fetch(SCRIPT_URL + "?action=getSchools").then(r => r.json()),
        fetch(SCRIPT_URL + "?action=getSeats").then(r => r.json())
      ]).then(([schools, seatsData]) => {
        schoolData = schools;
        const courseSelect = document.getElementById('course');
        courseSelect.innerHTML = '<option value="">-- เลือกหลักสูตรที่สนใจ --</option>';
        
        seatsData.order.forEach(course => {
          const remaining = seatsData.remaining[course];
          const isFull = remaining <= 0;
          const opt = document.createElement('option');
          opt.value = course;
          opt.textContent = isFull ? `❌ ${course} (เต็มแล้ว)` : `${course} (ว่าง ${remaining} ที่นั่ง)`;
          opt.disabled = isFull;
          courseSelect.appendChild(opt);
        });

        if(preSelectedCourse && seatsData.remaining[preSelectedCourse] > 0) {
           courseSelect.value = preSelectedCourse;
        }

        document.getElementById('formLoading').style.display = 'none';
      });

      document.addEventListener('click', (e) => {
        if(e.target.id !== 'schoolSearch') document.getElementById('schoolDropdown').style.display = 'none';
        if(e.target.id !== 'email') document.getElementById('emailDropdown').style.display = 'none';
      });
    };

    function checkHighSchool() {
      Swal.fire({
        title: 'คุณคือนักเรียนระดับมัธยมศึกษาตอนปลาย ใช่หรือไม่?',
        icon: 'question', showCancelButton: true, confirmButtonText: 'ใช่', cancelButtonText: 'ไม่ใช่',
        allowOutsideClick: false, customClass: { popup: 'rounded-3xl', confirmButton: 'bg-blue-600 rounded-xl px-6', cancelButton: 'rounded-xl' }
      }).then((res) => {
        if (res.dismiss === Swal.DismissReason.cancel) {
          Swal.fire({ title: 'ยกเลิกการลงทะเบียน', text: 'กิจกรรมนี้สงวนสิทธิ์เฉพาะนักเรียนระดับ ม.ปลาย ครับ', icon: 'info', confirmButtonText: 'กลับหน้าหลัก', allowOutsideClick: false })
          .then(() => window.location.href = 'index.html');
        }
      });
    }

    function showEmailSuggestions(val) {
      const drop = document.getElementById('emailDropdown');
      if(!val.includes('@') && val.length > 0) {
          drop.innerHTML = ['@gmail.com', '@hotmail.com', '@yahoo.com'].map(d => `<li onclick="document.getElementById('email').value='${val}${d}'; this.parentElement.style.display='none'">${val}<b class="text-blue-600">${d}</b></li>`).join('');
          drop.style.display = 'block';
      } else drop.style.display = 'none';
    }
    
    function formatPhone(el) {
      let v = el.value.replace(/\D/g,'');
      if(v.length > 10) v = v.substring(0,10);
      if(v.length > 6) el.value = v.substring(0,3)+'-'+v.substring(3,6)+'-'+v.substring(6);
      else if(v.length > 3) el.value = v.substring(0,3)+'-'+v.substring(3);
      else el.value = v;
    }

    function searchSchool(query) {
      const drop = document.getElementById('schoolDropdown');
      if(query.trim().length < 2) return drop.style.display = 'none';
      const res = schoolData.filter(s => s[0].toLowerCase().includes(query.toLowerCase())).slice(0, 8);
      drop.innerHTML = res.length > 0 ? res.map(s => `<li onclick="document.getElementById('schoolSearch').value='${s[0]}'; document.getElementById('province').value='${s[1]}'; this.parentElement.style.display='none'"><span class="font-bold">${s[0]}</span> <span class="text-xs text-orange-500 ml-1">จ.${s[1]}</span></li>`).join('') : `<li class="text-center text-slate-400">ไม่พบข้อมูล (พิมพ์ชื่อและเลือกจังหวัดเองได้เลย)</li>`;
      drop.style.display = 'block';
    }

    function togglePlatform(val) {
      const wrap = document.getElementById('wrapPlatform');
      if(val === 'ติดตาม') wrap.classList.remove('hidden');
      else { wrap.classList.add('hidden'); document.getElementById('followPlatform').value = ""; }
    }

    function submitForm() {
      const requiredIds = ['course', 'prefix', 'fname', 'lname', 'email', 'phone', 'grade', 'schoolSearch', 'province', 'followPage'];
      for(let id of requiredIds) {
        if(!document.getElementById(id).value.trim()) return Swal.fire({icon:'warning', title:'กรอกข้อมูลไม่ครบ', text:'กรุณากรอกข้อมูลที่มี * ให้ครบถ้วน'});
      }
      if(document.getElementById('phone').value.length !== 12) return Swal.fire({icon:'warning', title:'เบอร์โทรไม่ถูกต้อง', text:'กรุณากรอกเบอร์ให้ครบ 10 หลัก'});
      const srcNodes = document.querySelectorAll('input[name="src"]:checked');
      if(srcNodes.length === 0) return Swal.fire({icon:'warning', title:'กรอกข้อมูลไม่ครบ', text:'กรุณาเลือกแหล่งที่มาข่าวสารอย่างน้อย 1 ข้อ'});
      
      const followPage = document.getElementById('followPage').value;
      if(followPage === 'ติดตาม' && !document.getElementById('followPlatform').value) return Swal.fire({icon:'warning', title:'กรอกข้อมูลไม่ครบ', text:'กรุณาเลือกแพลตฟอร์ม'});

      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.innerHTML = '<i class="fi fi-sr-spinner animate-spin text-xl"></i> กำลังบันทึกข้อมูล (อาจใช้เวลาสักครู่)...';

      const payload = {
        course: document.getElementById('course').value, prefix: document.getElementById('prefix').value,
        fname: document.getElementById('fname').value.trim(), lname: document.getElementById('lname').value.trim(),
        email: document.getElementById('email').value.trim(), phone: document.getElementById('phone').value,
        grade: document.getElementById('grade').value, school: document.getElementById('schoolSearch').value.trim(), 
        province: document.getElementById('province').value, source: Array.from(srcNodes).map(n => n.value).join(', '), 
        followPage: followPage, followPlatform: followPage === 'ไม่ได้ติดตาม' ? '-' : document.getElementById('followPlatform').value
      };

      fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
      .then(res => res.json())
      .then(res => {
        if(res.status === 'success') {
          document.getElementById('formWrapper').style.display = 'none';
          document.getElementById('headerSection').style.display = 'none';
          document.getElementById('successView').classList.remove('hidden');
          
          document.getElementById('displayCourse').innerText = res.course;
          document.getElementById('displayId').innerText = res.id;
          document.getElementById('qrImage').src = res.qrUrl;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          Swal.fire({icon:'error', title:'ไม่สำเร็จ', text:res.message});
          btn.disabled = false; btn.innerHTML = 'ยืนยันการลงทะเบียน <i class="fi fi-sr-check-circle mt-1"></i>';
        }
      })
      .catch(err => {
          Swal.fire({icon:'error', title:'ระบบขัดข้อง', text:'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'});
          btn.disabled = false; btn.innerHTML = 'ยืนยันการลงทะเบียน <i class="fi fi-sr-check-circle mt-1"></i>';
      });
    }
  </script>
</body>
</html>
