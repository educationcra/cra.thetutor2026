<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>เข้าสู่ระบบ - CRA THE TUTOR 2026</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-solid-rounded/css/uicons-solid-rounded.css'>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    body { 
      font-family: 'Noto Sans Thai', sans-serif; 
      background-color: #f8fafc; /* พื้นหลังสีสว่าง สบายตา */
    }
    
    /* Glowing Background Effects (Light Theme) */
    .bg-glow-blue {
      position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw;
      background: #0ea5e9; border-radius: 50%;
      mix-blend-mode: multiply; filter: blur(150px); opacity: 0.15; z-index: 0; pointer-events: none;
    }
    .bg-glow-orange {
      position: fixed; bottom: -10%; right: -10%; width: 50vw; height: 50vw;
      background: #ff6b00; border-radius: 50%;
      mix-blend-mode: multiply; filter: blur(120px); opacity: 0.15; z-index: 0; pointer-events: none;
    }

    /* Glassmorphism Panel (White Glass) */
    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
    }

    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(10px) scale(0.98); } 
      to { opacity: 1; transform: translateY(0) scale(1); } 
    }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col relative overflow-hidden">

  <!-- Background Effect -->
  <div class="bg-glow-blue"></div>
  <div class="bg-glow-orange"></div>

  <!-- ปุ่มกลับหน้าหลัก -->
  <div class="w-full max-w-md mx-auto px-4 pt-8 pb-4 relative z-10">
      <a href="index.html" class="inline-flex items-center justify-center gap-2 bg-white/50 hover:bg-white/80 backdrop-blur-md border border-slate-200 text-slate-600 px-5 py-2.5 rounded-full font-bold transition-all no-underline text-sm shadow-sm hover:shadow-md">
          <i class="fi fi-sr-arrow-small-left mt-0.5 text-lg"></i> กลับหน้าหลัก
      </a>
  </div>

  <main class="w-full max-w-md mx-auto px-4 pb-12 relative z-10 flex-1 flex flex-col justify-center">
      
      <div class="glass-panel p-8 md:p-10 rounded-[2rem] fade-in relative overflow-hidden" id="mainPanel">
          
          <!-- ส่วนของฟอร์ม Login -->
          <div id="loginSection">
              <div class="text-center mb-8">
                  <div class="w-16 h-16 bg-gradient-to-br from-[#ff6b00] to-[#facc15] rounded-2xl mx-auto flex justify-center items-center mb-5 shadow-lg shadow-orange-500/20">
                      <i class="fi fi-sr-sign-in-alt text-3xl text-white mt-1 pl-1"></i>
                  </div>
                  <h1 class="text-3xl font-black text-slate-900 tracking-tight mb-2">เข้าสู่ระบบ</h1>
                  <p class="text-slate-500 text-sm font-medium">กรอกเบอร์โทรศัพท์ที่ใช้ลงทะเบียน<br>เพื่อเรียกดูบัตรประจำตัว</p>
              </div>

              <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
                  <div>
                      <div class="relative">
                          <i class="fi fi-sr-phone-call absolute left-5 top-1/2 transform -translate-y-1/2 text-slate-400 text-xl"></i>
                          <input type="tel" id="phoneInput" placeholder="0XX-XXX-XXXX" required
                                 class="w-full bg-white/80 text-slate-800 font-black px-14 py-4 rounded-xl outline-none border-2 border-slate-200 focus:border-[#ff6b00] focus:bg-white transition-all placeholder:font-medium placeholder:text-slate-400 text-xl tracking-widest text-center shadow-sm"
                                 oninput="formatPhone(this)">
                      </div>
                  </div>
                  
                  <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-[#0ea5e9] to-[#2563eb] text-white py-4 rounded-xl font-black shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 hover:-translate-y-0.5 transition-all flex justify-center items-center gap-2 text-lg">
                      <span>ตรวจสอบข้อมูล</span> <i class="fi fi-sr-search mt-1"></i>
                  </button>
              </form>
          </div>

          <!-- ส่วนแสดงข้อมูลบัตร E-Ticket (Dark Theme Card in Light Panel) -->
          <div id="profileSection" class="hidden text-center fade-in">
              
              <!-- E-Ticket Card (คงสีดำไว้ให้ดูพรีเมียมและตัดกับพื้นหลังขาว) -->
              <div class="bg-[#0f172a] p-8 pb-10 rounded-[2rem] text-white shadow-2xl mx-auto mb-6 relative overflow-hidden">
                  <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white rounded-full mix-blend-overlay filter blur-[50px] opacity-10"></div>
                  
                  <div class="relative z-10">
                      <p class="text-[11px] text-slate-400 font-bold mb-2 uppercase tracking-widest">หลักสูตรที่ลงทะเบียน</p>
                      
                      <!-- ป้ายบอกหลักสูตร -->
                      <div id="badgeCourse" class="inline-block px-5 py-2 rounded-full text-[15px] font-black mb-6 shadow-md text-white">
                          --
                      </div>
                      
                      <p class="text-[11px] text-slate-400 font-bold mb-1 uppercase tracking-widest">รหัสประจำตัว</p>
                      
                      <!-- รหัส ID -->
                      <div class="text-5xl sm:text-6xl font-black tracking-widest mb-2 drop-shadow-md" id="profileId">--</div>
                      
                      <!-- ชื่อและนามสกุล -->
                      <div class="text-lg font-bold text-white mb-8" id="profileName">--</div>
                      
                      <!-- กรอบรูป QR Code -->
                      <div class="bg-white p-3.5 rounded-[1.5rem] inline-block shadow-inner mx-auto relative group">
                          <img id="profileQr" src="" alt="QR Code" class="w-48 h-48 object-contain rounded-xl">
                          <!-- Fallback Loading spinner for Image -->
                          <div id="qrLoading" class="absolute inset-0 flex items-center justify-center bg-white rounded-[1.5rem]">
                              <i class="fi fi-sr-spinner animate-spin text-3xl text-slate-300"></i>
                          </div>
                      </div>
                      
                      <p class="text-[11px] text-slate-400 mt-6 font-medium">แสดง QR Code นี้แก่เจ้าหน้าที่เพื่อสแกนเข้างาน</p>
                  </div>
              </div>

              <!-- ปุ่มกดค้นหาใหม่ -->
              <button onclick="logout()" class="w-full bg-slate-100 text-slate-600 py-4 rounded-xl font-bold hover:bg-slate-200 border border-slate-200 transition-all flex justify-center items-center gap-2 shadow-sm">
                  <i class="fi fi-sr-refresh mt-0.5"></i> ค้นหาเบอร์อื่น
              </button>
          </div>

      </div>
  </main>

  <script>
    // ⚠️ ลิงก์ Web App ของคุณ
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCTpTOTqdytjmsEoBX8a88y3toayWDXBR6G6KzgGka6YhbnvmLNLOF1MuUtlGJnmv9/exec";

    // ตั้งค่ารหัสสีแยกตามหลักสูตร
    const courseConfigColor = {
      "แพทยศาสตร์": { bg: "bg-[#065f46]", text: "text-[#065f46]" },
      "วิทยาศาสตร์ข้อมูลสุขภาพ": { bg: "bg-[#a3e635]", text: "text-[#4d7c0f]" },
      "พยาบาลศาสตร์(4 ปี/หลักสูตรนานาชาติ 4 ปี)": { bg: "bg-[#38bdf8]", text: "text-[#0369a1]" },
      "รังสีเทคนิค": { bg: "bg-[#a855f7]", text: "text-[#a855f7]" },
      "วิทยาศาสตร์การเคลื่อนไหวและสุขภาพ": { bg: "bg-[#f97316]", text: "text-[#f97316]" },
      "ฉุกเฉินการแพทย์": { bg: "bg-[#1e3a8a]", text: "text-[#3b82f6]" },
      "นวัตกรรมวิทยาศาสตร์การแพทย์": { bg: "bg-[#eab308]", text: "text-[#eab308]" },
      "วิศวกรรมชีวการแพทย์": { bg: "bg-[#9f1239]", text: "text-[#e11d48]" },
      "เทคโนโลยีอาหารทางการแพทย์และสุขภาพ": { bg: "bg-[#ec4899]", text: "text-[#ec4899]" }
    };

    // ฟังก์ชันจัดรูปแบบเบอร์โทรให้อัตโนมัติ
    function formatPhone(input) {
        let v = input.value.replace(/\D/g, '');
        if(v.length > 10) v = v.substring(0, 10);
        if(v.length > 6) input.value = v.substring(0, 3) + '-' + v.substring(3, 6) + '-' + v.substring(6);
        else if(v.length > 3) input.value = v.substring(0, 3) + '-' + v.substring(3);
        else input.value = v;
    }

    function handleLogin(e) {
        e.preventDefault();
        
        const phone = document.getElementById('phoneInput').value.replace(/\D/g, '');
        if (phone.length !== 10) {
            Swal.fire({
                icon: 'warning', title: 'ข้อมูลไม่ถูกต้อง', text: 'กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลัก',
                confirmButtonColor: '#0ea5e9', background: '#ffffff', color: '#0f172a',
                customClass: { popup: 'rounded-3xl border border-slate-200' }
            });
            return;
        }

        const btn = document.getElementById('submitBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fi fi-sr-spinner animate-spin text-xl"></i> กำลังตรวจสอบ...';
        btn.disabled = true; btn.classList.add('opacity-75', 'cursor-not-allowed');

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'login', phone: phone })
        })
        .then(res => res.json())
        .then(data => {
            btn.innerHTML = originalText;
            btn.disabled = false; btn.classList.remove('opacity-75', 'cursor-not-allowed');

            if (data.status === 'success') {
                document.getElementById('loginSection').classList.add('hidden');
                
                // ถอดกรอบเพื่อให้การ์ดสีดำโดดเด่น
                document.getElementById('mainPanel').classList.remove('p-8', 'md:p-10', 'glass-panel', 'border');
                document.getElementById('mainPanel').classList.add('p-0', 'bg-transparent', 'shadow-none');
                
                document.getElementById('profileSection').classList.remove('hidden');
                
                document.getElementById('profileName').innerText = data.name;
                document.getElementById('profileId').innerText = data.id;
                
                const courseName = data.course || "ไม่ระบุหลักสูตร";
                const colors = courseConfigColor[courseName] || { bg: "bg-[#ff6b00]", text: "text-[#ff6b00]" };
                
                document.getElementById('badgeCourse').innerText = courseName;
                document.getElementById('badgeCourse').className = `inline-block px-5 py-2 rounded-full text-[15px] font-black mb-6 shadow-md text-white ${colors.bg}`;
                document.getElementById('profileId').className = `text-5xl sm:text-6xl font-black tracking-widest mb-2 drop-shadow-md ${colors.text}`;
                
                // โหลด QR Code
                const imgEl = document.getElementById('profileQr');
                const loadingEl = document.getElementById('qrLoading');
                
                loadingEl.style.display = 'flex'; 
                imgEl.onload = () => { loadingEl.style.display = 'none'; }; 
                imgEl.src = data.qrUrl || `https://quickchart.io/qr?size=400x400&margin=2&text=${data.id}`;

            } else {
                Swal.fire({
                    icon: 'error', title: 'ไม่พบข้อมูล', text: 'เบอร์โทรศัพท์นี้ยังไม่ได้ลงทะเบียน หรือกรอกข้อมูลผิดพลาด',
                    confirmButtonColor: '#0ea5e9', background: '#ffffff', color: '#0f172a',
                    customClass: { popup: 'rounded-3xl border border-slate-200' }
                });
            }
        })
        .catch(err => {
            console.error(err);
            btn.innerHTML = originalText; btn.disabled = false; btn.classList.remove('opacity-75', 'cursor-not-allowed');
            Swal.fire({
                icon: 'error', title: 'ข้อผิดพลาดเครือข่าย', text: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่',
                confirmButtonColor: '#0ea5e9', background: '#ffffff', color: '#0f172a',
                customClass: { popup: 'rounded-3xl border border-slate-200' }
            });
        });
    }

    function logout() {
        document.getElementById('phoneInput').value = '';
        document.getElementById('profileQr').src = ''; 
        
        // คืนค่ากรอบเมื่อค้นหาใหม่
        document.getElementById('mainPanel').classList.add('p-8', 'md:p-10', 'glass-panel', 'border');
        document.getElementById('mainPanel').classList.remove('p-0', 'bg-transparent', 'shadow-none');
                
        document.getElementById('profileSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
    }
  </script>
</body>
</html>
